<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>WMS CARISTE CLEAN</title>

<style>
body{
  font-family:Arial;
  background:#1e1e2f;
  color:white;
  padding:20px;
}

h1{text-align:center;}

.tabs{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:20px;
}

.tab{
  background:#444;
  padding:10px 15px;
  border-radius:6px;
  cursor:pointer;
}

.active{background:#3498db;}

.section{display:none;}
.show{display:block;}

.task{
  background:#2c2c3c;
  margin:10px 0;
  padding:12px;
  border-radius:8px;
}

input{
  padding:5px;
  width:80px;
  border-radius:5px;
  border:none;
}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.valid{background:#27ae60;color:white;}
.clear{background:#e74c3c;color:white;}
</style>
</head>

<body>

<h1>🚜 WMS CARISTE</h1>

<div class="tabs">
  <div class="tab active" onclick="show('restock',event)">🚨 Réappro</div>
  <div class="tab" onclick="show('stock',event)">📦 Stock</div>
  <div class="tab" onclick="show('quai',event)">🚚 Quai</div>
  <div class="tab" onclick="show('errors',event)">❌ Erreurs</div>
</div>

<div id="restock" class="section show"></div>
<div id="stock" class="section"></div>
<div id="quai" class="section"></div>
<div id="errors" class="section"></div>

<script>

const API = "http://192.168.1.46:3000";

/* =========================
   PRODUITS
========================= */
const produits=[
{nom:"Fromages",emp:"15.002"},
{nom:"Beurre",emp:"15.003"},
{nom:"Betterave en conserve",emp:"30.001"},
{nom:"Carotte en conserve",emp:"30.002"},
{nom:"Panais en conserve",emp:"30.003"},
{nom:"Céréale",emp:"30.006"},
{nom:"Sel de Table",emp:"30.007"},
{nom:"Moulin a poivre",emp:"30.008"},
{nom:"Chips",emp:"30.009"},
{nom:"Sucre",emp:"30.010"},
{nom:"Farine",emp:"30.011"},
{nom:"Oeuf",emp:"30.012"},
{nom:"Miel",emp:"31.001"},
{nom:"Raisin sec",emp:"31.002"},
{nom:"Chocolat",emp:"31.003"},
{nom:"Huile de tournesol",emp:"32.001"},
{nom:"Huile d'olive",emp:"32.002"},
{nom:"Huile de colza",emp:"32.003"},
{nom:"Soupe de carotte",emp:"32.004"},
{nom:"Soupe de betterave",emp:"32.005"},
{nom:"Soupe Triple",emp:"32.006"},
{nom:"Soupe de Panais",emp:"32.007"},
{nom:"Lait",emp:"32.008"},
{nom:"Jus de raisin",emp:"32.009"},
{nom:"Soupe de patate",emp:"32.010"},
{nom:"Canne a sucre",emp:"40.001"},
{nom:"Tomates",emp:"40.002"},
{nom:"Laitue",emp:"40.003"}, 
{nom:"Fraise",emp:"40.005"}, 
{nom:"Raisin vrac",emp:"40.006"},
{nom:"Arbre a chat",emp:"46.001"},
{nom:"Vêtement",emp:"46.002"},
{nom:"Mobilier",emp:"46.003"},
{nom:"Rouleau de papier",emp:"46.004"},
{nom:"Maison à Oiseaux",emp:"46.005"},
{nom:"Planche",emp:"46.006"},
{nom:"Gateaux",emp:"45.003"},
{nom:"Pain",emp:"45.004"},
];

/* =========================
   NAVIGATION
========================= */
function show(id,e){

document.querySelectorAll(".section").forEach(s=>s.classList.remove("show"));
document.getElementById(id).classList.add("show");

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
if(e) e.target.classList.add("active");

if(id==="stock") loadStock();
if(id==="restock") loadRestock();
if(id==="quai") loadQuai();
if(id==="errors") loadErrors();
}

/* =========================
   REAPPRO
========================= */
async function loadRestock(){

let r = await (await fetch(API+"/restock")).json();

let div = document.getElementById("restock");
div.innerHTML="";

if(!r.length){
div.innerHTML="✔ Aucun réappro";
return;
}

r.forEach((x,i)=>{

div.innerHTML += `
<div class="task">
<b>${x.prod}</b> (${x.emp})<br>
📦 ${x.qty}<br>

<input id="q${i}" type="number" value="${x.qty}">
<button class="valid" onclick="valider(${i})">✔</button>
</div>
`;

});

}

/* =========================
   VALID REAPPRO (SERVER)
========================= */
async function valider(i){

let r = await (await fetch(API+"/restock")).json();
let item = r[i];
if(!item) return;

let q = parseInt(document.getElementById("q"+i).value)||0;

/* stock */
let stock = await (await fetch(API+"/stock")).json();

if(!stock[item.emp]) stock[item.emp]={rack:0,pick:0};

stock[item.emp].pick += q;
stock[item.emp].rack = Math.max(0, stock[item.emp].rack - q);

/* save stock */
await fetch(API+"/stock",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(stock)
});

/* remove restock */
r.splice(i,1);

await fetch(API+"/restock",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(r)
});

loadRestock();
}

/* =========================
   STOCK
========================= */
async function loadStock(){

let stock = await (await fetch(API+"/stock")).json();

let div = document.getElementById("stock");
div.innerHTML="<h2>📦 STOCK</h2>";

produits.forEach(p=>{

let s = stock[p.emp]||{rack:0,pick:0};

div.innerHTML += `
<div class="task">
<b>${p.nom}</b> (${p.emp})<br>

🏭 Rack:
<input type="number" value="${s.rack}"
onchange="updateStock('${p.emp}','rack',this.value)">

📦 Pick:
<input type="number" value="${s.pick}"
onchange="updateStock('${p.emp}','pick',this.value)">
</div>
`;

});

}

/* =========================
   UPDATE STOCK
========================= */
async function updateStock(emp,type,value){

let stock = await (await fetch(API+"/stock")).json();

if(!stock[emp]) stock[emp]={rack:0,pick:0};

stock[emp][type]=parseInt(value)||0;

await fetch(API+"/stock",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(stock)
});

}

/* =========================
   QUAI
========================= */
async function loadQuai(){

let q = await (await fetch(API+"/quai")).json();

let div = document.getElementById("quai");
div.innerHTML="";

if(!q.length){
div.innerHTML="✔ Aucun quai";
return;
}

q.forEach((x,i)=>{

div.innerHTML += `
<div class="task">
<b>Commande ${x.id}</b><br>
🏭 ${x.prep} → 🚚 ${x.dest}
<br><br>
<button onclick="validerQuai(${i})">✔</button>
<button onclick="supprimerQuai(${i})">❌</button>
</div>
`;

});

}

/* =========================
   QUAI VALID
========================= */
async function validerQuai(i){

let q = await (await fetch(API+"/quai")).json();

q.splice(i,1);

await fetch(API+"/quai",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(q)
});

loadQuai();

}

/* =========================
   QUAI DELETE
========================= */
async function supprimerQuai(i){

let q = await (await fetch(API+"/quai")).json();

q.splice(i,1);

await fetch(API+"/quai",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(q)
});

loadQuai();

}

/* =========================
   ERREURS
========================= */
async function loadErrors(){

let e = await (await fetch(API+"/errors")).json();

let div = document.getElementById("errors");
div.innerHTML="";

if(!e.length){
div.innerHTML="✔ Aucune erreur";
return;
}

e.forEach(x=>{

div.innerHTML += `
<div class="task">
❌ ${x.prod}<br>
📦 ${x.emp}<br>
⚠ ${x.type}
</div>
`;

});

}

/* INIT */
loadRestock();

</script>

</body>
</html>

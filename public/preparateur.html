<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>WMS Simple PRO</title>

<style>
body{
font-family:Arial;
background:#eef2f5;
padding:20px;
}

.box{
max-width:1000px;
margin:auto;
background:white;
padding:15px;
border-radius:10px;
}

.cmd{
padding:10px;
border:1px solid #ddd;
border-radius:8px;
margin:10px 0;
cursor:pointer;
}

.item{
display:flex;
justify-content:space-between;
padding:10px;
border-bottom:1px solid #eee;
}

.done{
opacity:0.5;
background:#f2f2f2;
}

button{
margin-left:5px;
padding:6px;
border:none;
border-radius:6px;
cursor:pointer;
}

.valid{background:#2ecc71;color:white;}
.error{background:#e74c3c;color:white;}
.restock{background:#f39c12;color:white;}
.back{background:#3498db;color:white;}
</style>
</head>

<body>

<h1>📦 WMS SIMPLE</h1>

<div class="box" id="view"></div>

<script>

/* ======================
   🌐 SERVEUR
====================== */
const API = "https://TON-APP.onrender.com";

/* ======================
   PRODUITS
====================== */
const produits=[
{nom:"Fromages",emp:"15.002"},
{nom:"Beurre",emp:"15.003"},
{nom:"Carotte",emp:"30.002"},
{nom:"Sucre",emp:"30.010"},
{nom:"Lait",emp:"32.008"},
{nom:"Tomates",emp:"40.002"},
{nom:"Fraise",emp:"40.005"},
{nom:"Planche",emp:"46.006"},
];

/* ======================
   DATA
====================== */
let commandes=[];
let current=null;

/* ======================
   LOAD
====================== */
async function load(){

let res = await fetch(API+"/commandes");
commandes = await res.json();

if(!commandes.length){
commandes = gen();
await save();
}

menu();

}

/* ======================
   SAVE
====================== */
async function save(){
await fetch(API+"/commandes",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(commandes)
});
}

/* ======================
   GENERATION
====================== */
function gen(){

let cmds=[];

for(let i=0;i<10;i++){

let items = produits.map(p=>({
...p,
qty:Math.floor(Math.random()*3)+1,
done:false,
taken:0
}));

cmds.push({
id:"CMD-"+Math.floor(Math.random()*9999),
items,
status:"active"
});

}

return cmds;
}

/* ======================
   MENU
====================== */
function menu(){

let v=document.getElementById("view");

v.innerHTML="<h2>📦 Commandes</h2>";

commandes.forEach(c=>{

let div=document.createElement("div");
div.className="cmd";
div.innerHTML=`<b>${c.id}</b>`;

div.onclick=()=>open(c);

v.appendChild(div);

});

}

/* ======================
   OPEN
====================== */
function open(c){
current=c;
render();
}

/* ======================
   RENDER
====================== */
function render(){

let v=document.getElementById("view");

v.innerHTML=`
<button class="back" onclick="menu()">⬅ Retour</button>
<h2>${current.id}</h2>
`;

current.items.forEach(i=>{

let d=document.createElement("div");
d.className="item "+(i.done?"done":"");

d.innerHTML=`
<div>
<b>${i.nom}</b><br>
📦 ${i.qty} demandés<br>
✔ ${i.taken}
</div>

<div>
<input type="number" min="0" max="${i.qty}" placeholder="pris">

<button class="valid" onclick="valid(i,this)">✔</button>
<button class="error" onclick="err(i)">❌</button>
<button class="restock" onclick="restock(i)">🚨</button>
</div>
`;

v.appendChild(d);

});

}

/* ======================
   VALIDATION PRODUIT
====================== */
async function valid(i,btn){

let input = btn.parentElement.querySelector("input");
let taken = parseInt(input.value);

if(isNaN(taken)) return alert("❌ invalide");

if(taken > i.qty) return alert("❌ trop élevé");

i.taken = taken;
i.done = true;

await update();

render();

}

/* ======================
   ERREUR
====================== */
async function err(i){

await fetch(API+"/errors",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
prod:i.nom,
emp:i.emp,
time:Date.now()
})
});

alert("❌ envoyé");

}

/* ======================
   REAPPRO
====================== */
async function restock(i){

await fetch(API+"/restock",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
prod:i.nom,
emp:i.emp,
qty:i.qty,
time:Date.now()
})
});

alert("🚨 réappro envoyé");

}

/* ======================
   UPDATE
====================== */
async function update(){
await fetch(API+"/commandes",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(commandes)
});
}

/* ======================
   START
====================== */
load();

</script>

</body>
</html>

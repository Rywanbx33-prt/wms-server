<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>WMS Préparateur PRO</title>

<style>
body{
font-family:Arial;
background:#eef2f5;
margin:0;
padding:20px;
}

h1{text-align:center;}

.box{
background:white;
max-width:1100px;
margin:auto;
padding:15px;
border-radius:12px;
}

.cmd{
padding:12px;
border:1px solid #ddd;
border-radius:10px;
margin:10px 0;
cursor:pointer;
background:#fff;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
border-bottom:1px solid #eee;
}

.item.done{
opacity:0.5;
background:#f0f0f0;
}

input{
width:140px;
padding:6px;
border-radius:6px;
border:1px solid #ccc;
}

button{
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
margin-left:5px;
}

.valid{background:#2ecc71;color:white;}
.error{background:#e74c3c;color:white;}
.restock{background:#f39c12;color:white;}
.back{background:#3498db;color:white;color:white;}
.nav{background:#9b59b6;color:white;}
.finish{background:#16a085;color:white;}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.badge{
background:#3498db;
color:white;
padding:3px 8px;
border-radius:6px;
font-size:12px;
}

</style>
</head>

<body>

<h1>📦 WMS PRÉPARATEUR PRO</h1>

<div class="box" id="view"></div>

<script>

/* ======================
   🌐 SERVEUR RENDER
====================== */
const API_URL = "https://TON-APP.onrender.com";

/* ======================
   PRODUITS
====================== */
const produits=[
{nom:"Fromages",emp:"15.002"},
{nom:"Beurre",emp:"15.003"},
{nom:"Carotte",emp:"30.002"},
{nom:"Sucre",emp:"30.010"},
{nom:"Lait",emp:"32.008"},
{nom:"Tomates",emp:"40.002"},
{nom:"Fraise",emp:"40.005"},
{nom:"Planche",emp:"46.006"},
];

/* ======================
   DATA
====================== */
let commandes=[];
let current=null;

/* ======================
   LOAD
====================== */
async function load(){

try{
let res = await fetch(API_URL+"/commandes");
commandes = await res.json();

if(!commandes.length){
commandes = gen();
await save();
}

menu();

}catch(e){
console.error(e);
commandes = gen();
await save();
menu();
}

}

/* ======================
   SAVE
====================== */
async function save(){
await fetch(API_URL+"/commandes",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(commandes)
});
}

/* ======================
   GENERATION
====================== */
function gen(){

let cmds=[];

for(let i=0;i<12;i++){

let items = produits.map(p=>{

let qty = Math.floor(Math.random()*3)+1;

return {
...p,
qty,
done:false,
taken:0
};

});

cmds.push({
id:"CMD-"+Math.floor(Math.random()*9999),
prep:"08",
dest:"02",
items,
status:"active"
});

}

return cmds;
}

/* ======================
   MENU
====================== */
function menu(){

let v=document.getElementById("view");

v.innerHTML=`
<div class="header">
<h2>📦 Commandes</h2>
<button onclick="regen()" class="nav">🔄 Générer</button>
</div>
`;

commandes.forEach(c=>{

let div=document.createElement("div");
div.className="cmd";

div.innerHTML=`
<b>${c.id}</b><br>
${c.items.length} produits
`;

div.onclick=()=>open(c);

v.appendChild(div);

});

}

/* ======================
   OPEN COMMANDE
====================== */
function open(c){
current=c;
render();
}

/* ======================
   RENDER PRODUITS
====================== */
function render(){

let v=document.getElementById("view");

v.innerHTML=`
<button class="back" onclick="menu()">🏠 Retour</button>
<h2>${current.id}</h2>
`;

current.items.forEach(i=>{

let d=document.createElement("div");
d.className="item "+(i.done?"done":"");

d.innerHTML=`
<div>
<b>${i.nom}</b><br>
📦 demandé : ${i.qty}<br>
✔ pris : ${i.taken || 0}
</div>

<div>
<input type="number"
min="0"
max="${i.qty}"
placeholder="palettes">

<button class="valid" onclick="valid(i,this)">✔</button>
<button class="error" onclick="err(i)">❌</button>
<button class="restock" onclick="restock(i)">🚨</button>
</div>
`;

v.appendChild(d);

});

}

/* ======================
   VALIDATION PRODUIT
====================== */
async function valid(i,btn){

let input = btn.parentElement.querySelector("input");
let taken = parseInt(input.value);

if(isNaN(taken)){
alert("❌ quantité invalide");
return;
}

if(taken > i.qty){
alert("❌ trop élevé");
return;
}

i.taken = taken;
i.done = true;

await update();

render();

}

/* ======================
   ERREUR
====================== */
async function err(i){

await fetch(API_URL+"/errors",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
prod:i.nom,
emp:i.emp,
time:Date.now()
})
});

alert("❌ envoyé");

}

/* ======================
   REAPPRO
====================== */
async function restock(i){

await fetch(API_URL+"/restock",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
prod:i.nom,
emp:i.emp,
qty:i.qty,
time:Date.now()
})
});

alert("🚨 réappro envoyé");

}

/* ======================
   UPDATE SERVEUR
====================== */
async function update(){
await fetch(API_URL+"/commandes",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(commandes)
});
}

/* ======================
   REGEN
====================== */
async function regen(){
commandes = gen();
await save();
menu();
}

/* ======================
   START
====================== */
load();

</script>

</body>
</html>

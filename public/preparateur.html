<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>WMS Préparateur</title>

<style>
body{
  font-family:Arial;
  background:#1e1e2f;
  color:white;
  padding:20px;
}

h1{text-align:center;}

.tabs{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:20px;
}

.tab{
  background:#444;
  padding:10px 15px;
  border-radius:6px;
  cursor:pointer;
}

.active{background:#3498db;}

.section{display:none;}
.show{display:block;}

.task{
  background:#2c2c3c;
  margin:10px 0;
  padding:12px;
  border-radius:8px;
}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.ok{background:#27ae60;color:white;}
.err{background:#e74c3c;color:white;}
.end{background:#3498db;color:white;}
.gen{background:#9b59b6;color:white;margin:10px auto;display:block;}
</style>
</head>

<body>

<h1>📦 PRÉPARATEUR</h1>

<div class="tabs">
  <div class="tab active" onclick="show('orders',event)">📦 Commandes</div>
  <div class="tab" onclick="show('done',event)">✔ Terminées</div>
</div>

<!-- BOUTON GENERATION -->
<button class="gen" onclick="generateOrders()">🔁 Générer 12 commandes</button>

<div id="orders" class="section show"></div>
<div id="done" class="section"></div>

<script>

const API = "http://192.168.1.46:3000";

/* =========================
   EMPLACEMENTS (zones)
========================= */
const emplacements = [
"15-001","15-002","15-003","15-004","15-005","15-006",
"20-001","20-002","20-003","20-004",
"30-001","30-002","30-003","30-004",
"40-001","40-002","40-003","40-004",
"46-001","46-002","46-003","46-004","46-005","46-006"
];

/* =========================
   GENERATION COMMANDES
========================= */
async function generateOrders(){

let orders = [];

for(let i=1;i<=12;i++){

let lines = [];
let used = new Set();

// 3 à 6 lignes par commande
let nbLines = Math.floor(Math.random()*4)+3;

for(let j=0;j<nbLines;j++){

let emp;
do{
emp = emplacements[Math.floor(Math.random()*emplacements.length)];
}while(used.has(emp));

used.add(emp);

lines.push({
prod:"Produit "+emp,
emp:emp,
qty: Math.floor(Math.random()*2)+1  // 1 ou 2
});
}

orders.push({
id:"CMD-"+Date.now()+"-"+i,
lines:lines
});

}

await fetch(API+"/orders",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(orders)
});

alert("✔ 12 commandes générées");
loadOrders();
}

/* =========================
   NAVIGATION
========================= */
function show(id,e){

document.querySelectorAll(".section").forEach(s=>s.classList.remove("show"));
document.getElementById(id).classList.add("show");

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
if(e) e.target.classList.add("active");

if(id==="orders") loadOrders();
if(id==="done") loadDone();
}

/* =========================
   CHARGER COMMANDES
========================= */
async function loadOrders(){

let orders = await (await fetch(API+"/orders")).json();

let div = document.getElementById("orders");
div.innerHTML="";

if(!orders.length){
div.innerHTML="✔ Aucune commande";
return;
}

orders.forEach((o,i)=>{

let html = `<div class="task">
<b>${o.id}</b><br><br>`;

o.lines.forEach(l=>{
html += `
📦 ${l.prod}<br>
📍 ${l.emp}<br>
🔢 Qté : ${l.qty}<br><br>
`;
});

html += `
<button class="ok" onclick="valider(${i})">✔ Valider</button>
<button class="err" onclick="erreur(${i})">❌ Erreur</button>
<button class="end" onclick="terminer(${i})">✔ Terminer</button>
</div>`;

div.innerHTML += html;

});

}

/* =========================
   VALIDATION (simplifiée)
========================= */
async function valider(i){

let orders = await (await fetch(API+"/orders")).json();
let o = orders[i];
if(!o) return;

let stock = await (await fetch(API+"/stock")).json();

o.lines.forEach(l=>{

if(!stock[l.emp]) stock[l.emp]={rack:0,pick:0};

stock[l.emp].pick = Math.max(0, stock[l.emp].pick - l.qty);

});

await fetch(API+"/stock",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(stock)
});

alert("✔ Commande validée");
}

/* =========================
   ERREUR
========================= */
async function erreur(i){

let orders = await (await fetch(API+"/orders")).json();
let o = orders[i];
if(!o) return;

let type = prompt("Type d'erreur ?") || "non défini";

let errors = await (await fetch(API+"/errors")).json();

o.lines.forEach(l=>{
errors.push({
prod:l.prod,
emp:l.emp,
type:type,
time:Date.now()
});
});

await fetch(API+"/errors",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(errors)
});

alert("❌ Erreur envoyée");
}

/* =========================
   TERMINER
========================= */
async function terminer(i){

let orders = await (await fetch(API+"/orders")).json();
let done = await (await fetch(API+"/orders_done")).json();

done.push(orders[i]);
orders.splice(i,1);

await fetch(API+"/orders",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(orders)
});

await fetch(API+"/orders_done",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(done)
});

loadOrders();
}

/* =========================
   TERMINÉES
========================= */
async function loadDone(){

let done = await (await fetch(API+"/orders_done")).json();

let div = document.getElementById("done");
div.innerHTML="";

if(!done.length){
div.innerHTML="✔ Rien terminé";
return;
}

done.forEach(o=>{
div.innerHTML += `
<div class="task">
✔ <b>${o.id}</b><br><br>
${o.lines.map(l=>`
📦 ${l.prod} | 📍 ${l.emp} | 🔢 ${l.qty}<br>
`).join("")}
</div>`;
});

}

/* INIT */
loadOrders();

</script>

</body>
</html>

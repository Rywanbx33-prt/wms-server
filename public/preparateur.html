<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>WMS Préparateur</title>

<style>
body{font-family:Arial;background:#eef2f5;padding:20px;}
h1{text-align:center;}

.box{
  background:white;
  padding:15px;
  border-radius:10px;
  max-width:1000px;
  margin:auto;
}

.cmd{
  padding:10px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:8px;
  cursor:pointer;
  background:#fff;
}

.item{
  display:flex;
  justify-content:space-between;
  padding:10px;
  border-bottom:1px solid #eee;
}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.read{background:#f39c12;color:white;}
.valid{background:#2ecc71;color:white;}
.error{background:#e74c3c;color:white;}
.restock{background:#e74c3c;color:white;}
.nav{background:#3498db;color:white;}
.finish{background:#8e44ad;color:white;}
.back{background:#e74c3c;color:white;}

.done{opacity:0.5;background:#dcdcdc;}
</style>
</head>

<body>

<h1>📦 WMS PREPARATEUR RENDER</h1>

<div class="box" id="view"></div>

<script>

/* ======================
   🌐 SERVEUR RENDER
====================== */
const API = "https://TON-APP.onrender.com";

/* ======================
   PRODUITS
====================== */
const produits=[
{nom:"Fromages",emp:"15.002"},
{nom:"Beurre",emp:"15.003"},
{nom:"Betterave en conserve",emp:"30.001"},
{nom:"Carotte en conserve",emp:"30.002"},
{nom:"Panais en conserve",emp:"30.003"},
{nom:"Céréale",emp:"30.006"},
{nom:"Sel de Table",emp:"30.007"},
{nom:"Moulin a poivre",emp:"30.008"},
{nom:"Chips",emp:"30.009"},
{nom:"Sucre",emp:"30.010"},
{nom:"Farine",emp:"30.011"},
{nom:"Oeuf",emp:"30.012"},
{nom:"Miel",emp:"31.001"},
{nom:"Raisin sec",emp:"31.002"},
{nom:"Chocolat",emp:"31.003"},
{nom:"Huile de tournesol",emp:"32.001"},
{nom:"Huile d'olive",emp:"32.002"},
{nom:"Huile de colza",emp:"32.003"},
{nom:"Soupe",emp:"32.004"},
{nom:"Lait",emp:"32.008"},
{nom:"Tomates",emp:"40.002"},
{nom:"Laitue",emp:"40.003"},
{nom:"Fraise",emp:"40.005"},
{nom:"Planche",emp:"46.006"},
];

/* ======================
   COMMANDES
====================== */
let commandes = [];

/* ======================
   LOAD SERVEUR
====================== */
async function load(){
try{
let res = await fetch(API + "/commandes");
commandes = await res.json();

if(!commandes || commandes.length === 0){
commandes = gen();
await save();
}

menu();

}catch(e){
console.error(e);
commandes = gen();
await save();
menu();
}
}

/* ======================
   SAVE SERVEUR
====================== */
async function save(){
await fetch(API + "/commandes", {
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(commandes)
});
}

/* ======================
   GENERATION
====================== */
function gen(){

let cmds=[];
let heavy=[0,1,2,3];

for(let c=0;c<12;c++){

let isHeavy = heavy.includes(c);

let items = produits.map(p=>{
let zone = p.emp.split(".")[0];
let qty;

if(isHeavy && ["30","32","40"].includes(zone)){
qty = Math.floor(Math.random()*2)+3;
}else{
qty = Math.floor(Math.random()*2)+1;
}

return {...p,qty,zone,done:false};
});

cmds.push({
id:`CMD-${Math.floor(Math.random()*9999)}`,
prep:"08",
dest:"02",
items,
heavy:isHeavy,
status:"active"
});
}

return cmds;
}

/* ======================
   MENU
====================== */
function menu(){

let v=document.getElementById("view");

v.innerHTML=`
<h2>📦 Commandes</h2>
<button onclick="regen()">🔄 Générer</button>
`;

commandes.forEach(c=>{

let div=document.createElement("div");
div.className="cmd";

div.innerHTML=`
<b>${c.id}</b><br>
${c.items.length} articles
`;

div.onclick=()=>open(c);

v.appendChild(div);
});
}

/* ======================
   REGEN
====================== */
async function regen(){
commandes=gen();
await save();
menu();
}

/* ======================
   OPEN
====================== */
let current=null;
let zones=[];
let zi=0;

function open(c){
current=c;
zones=[...new Set(c.items.map(i=>i.zone))];
zi=0;
render();
}

/* ======================
   RENDER
====================== */
function render(){

let v=document.getElementById("view");
let z=zones[zi];
let items=current.items.filter(i=>i.zone===z);

v.innerHTML=`
<button class="back" onclick="menu()">🏠</button>
<h2>${current.id}</h2>
`;

items.forEach(i=>{

let d=document.createElement("div");
d.className="item "+(i.done?"done":"");

d.innerHTML=`
<div>
<b>${i.nom}</b><br>
${i.emp} | ${i.qty}
</div>

<div>
<button onclick="valid(i)">✔</button>
<button onclick="err(i)">❌</button>
<button onclick="rest(i)">🚨</button>
</div>
`;

v.appendChild(d);

});
}

/* ======================
   VALIDATION PRODUIT
====================== */
async function valid(i){
i.done=true;
await update();
render();
}

/* ======================
   ERREUR
====================== */
async function err(i){

await fetch(API+"/errors",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
prod:i.nom,
emp:i.emp,
zone:i.zone,
time:Date.now()
})
});

alert("❌ envoyé");
}

/* ======================
   REAPPRO
====================== */
async function rest(i){

await fetch(API+"/restock",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
prod:i.nom,
emp:i.emp,
zone:i.zone,
qty:i.qty
})
});

alert("🚨 réappro envoyé");
}

/* ======================
   UPDATE SERVEUR
====================== */
async function update(){
await fetch(API+"/commandes",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(commandes)
});
}

/* ======================
   START
====================== */
load();

</script>

</body>
</html>

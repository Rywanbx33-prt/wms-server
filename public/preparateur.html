<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>WMS Préparateur</title>

<style>
body{
  font-family:Arial;
  background:#121826;
  color:white;
  padding:20px;
}

h1{text-align:center;}

.tabs{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:20px;
}

.tab{
  background:#444;
  padding:10px 15px;
  border-radius:6px;
  cursor:pointer;
}

.active{background:#3498db;}

.section{display:none;}
.show{display:block;}

.task{
  background:#1f2937;
  margin:10px 0;
  padding:12px;
  border-radius:8px;
}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.ok{background:#27ae60;color:white;}
.err{background:#e74c3c;color:white;}
.end{background:#3498db;color:white;}
</style>
</head>

<body>

<h1>📦 WMS PRÉPARATEUR</h1>

<div class="tabs">
  <div class="tab active" onclick="show('orders',event)">📦 Commandes</div>
  <div class="tab" onclick="show('done',event)">✔ Terminées</div>
</div>

<div id="orders" class="section show"></div>
<div id="done" class="section"></div>

<script>

const API = "http://192.168.1.46:3000";

/* =========================
   NAVIGATION
========================= */
function show(id,e){

document.querySelectorAll(".section").forEach(s=>s.classList.remove("show"));
document.getElementById(id).classList.add("show");

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
if(e) e.target.classList.add("active");

if(id==="orders") loadOrders();
if(id==="done") loadDone();
}

/* =========================
   LOAD COMMANDES
========================= */
async function loadOrders(){

let orders = await (await fetch(API+"/orders")).json();

let div = document.getElementById("orders");
div.innerHTML="";

if(!orders.length){
div.innerHTML="✔ Aucune commande";
return;
}

orders.forEach((o,i)=>{

div.innerHTML += `
<div class="task">

<b>Commande ${o.id}</b><br><br>

📦 ${o.prod}<br>
📍 ${o.emp}<br>
🔢 ${o.qty}

<br><br>

<button class="ok" onclick="validateLine(${i})">✔ OK</button>
<button class="err" onclick="sendError(${i})">❌ Erreur</button>
<button class="end" onclick="finishOrder(${i})">✔ Terminer</button>

</div>
`;

});

}

/* =========================
   TERMINER COMMANDE
========================= */
async function finishOrder(i){

let orders = await (await fetch(API+"/orders")).json();

let done = await (await fetch(API+"/orders_done")).json();

let order = orders[i];
if(!order) return;

/* move done */
done.push(order);

/* remove order */
orders.splice(i,1);

/* save */
await fetch(API+"/orders",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(orders)
});

await fetch(API+"/orders_done",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(done)
});

loadOrders();

}

/* =========================
   VALIDER UNE LIGNE
========================= */
async function validateLine(i){

let orders = await (await fetch(API+"/orders")).json();

let o = orders[i];
if(!o) return;

/* update stock */
let stock = await (await fetch(API+"/stock")).json();

if(!stock[o.emp]) stock[o.emp]={rack:0,pick:0};

stock[o.emp].pick = Math.max(0, stock[o.emp].pick - o.qty);

await fetch(API+"/stock",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(stock)
});

alert("✔ Ligne validée");

}

/* =========================
   ERREUR
========================= */
async function sendError(i){

let orders = await (await fetch(API+"/orders")).json();

let type = prompt("Type d'erreur ?") || "non défini";

let o = orders[i];
if(!o) return;

let errors = await (await fetch(API+"/errors")).json();

errors.push({
prod:o.prod,
emp:o.emp,
zone:o.zone,
type:type,
time:Date.now()
});

await fetch(API+"/errors",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(errors)
});

alert("❌ Erreur envoyée");

}

/* =========================
   COMMANDES TERMINÉES
========================= */
async function loadDone(){

let done = await (await fetch(API+"/orders_done")).json();

let div = document.getElementById("done");
div.innerHTML="";

if(!done.length){
div.innerHTML="✔ Rien de terminé";
return;
}

done.forEach(o=>{

div.innerHTML += `
<div class="task">
✔ <b>${o.id}</b><br>
📦 ${o.prod}<br>
📍 ${o.emp}
</div>
`;

});

}

/* INIT */
loadOrders();

</script>

</body>
</html>

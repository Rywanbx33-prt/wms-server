<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>WMS Préparateur</title>

<style>
body{font-family:Arial;background:#eef2f5;padding:20px;}
h1{text-align:center;}

.box{
  background:white;
  padding:15px;
  border-radius:10px;
  max-width:1000px;
  margin:auto;
}

.cmd{
  padding:10px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:8px;
  cursor:pointer;
  background:#fff;
}

.zone{
  font-size:18px;
  font-weight:bold;
  margin:10px 0;
}

.item{
  display:flex;
  justify-content:space-between;
  padding:10px;
  border-bottom:1px solid #eee;
}

.info{font-size:12px;color:#666;}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.read{background:#f39c12;color:white;}
.valid{background:#2ecc71;color:white;}
.error{background:#e74c3c;color:white;}
.restock{background:#e74c3c;color:white;}
.nav{background:#3498db;color:white;}
.finish{background:#8e44ad;color:white;}
.back{background:#e74c3c;color:white;}

.badge{
  display:inline-block;
  padding:3px 8px;
  background:#3498db;
  color:white;
  border-radius:6px;
  font-size:12px;
}
.quais{
  display:flex;
  gap:15px;
  align-items:center;
  font-weight:bold;
  margin:10px 0;
}
.done{
opacity:0.5;
background:#dcdcdc;
}
.heavy{
background:#ffcccb;
border-left:5px solid red;
}

.fire{
color:red;
font-weight:bold;
margin-left:6px;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{opacity:1;}
50%{opacity:0.4;}
100%{opacity:1;}
}
</style>
</head>

<body>

<h1>📦 WMS PRÉPARATEUR SERVER</h1>

<div class="box" id="view"></div>

<script>

/* ======================
   PRODUITS
====================== */

const produits=[
{nom:"Fromages",emp:"15.002"},
{nom:"Beurre",emp:"15.003"},
{nom:"Betterave en conserve",emp:"30.001"},
{nom:"Carotte en conserve",emp:"30.002"},
{nom:"Panais en conserve",emp:"30.003"},
{nom:"Céréale",emp:"30.006"},
{nom:"Sel de Table",emp:"30.007"},
{nom:"Moulin a poivre",emp:"30.008"},
{nom:"Chips",emp:"30.009"},
{nom:"Sucre",emp:"30.010"},
{nom:"Farine",emp:"30.011"},
{nom:"Oeuf",emp:"30.012"},
{nom:"Miel",emp:"31.001"},
{nom:"Raisin sec",emp:"31.002"},
{nom:"Chocolat",emp:"31.003"},
{nom:"Huile de tournesol",emp:"32.001"},
{nom:"Huile d'olive",emp:"32.002"},
{nom:"Huile de colza",emp:"32.003"},
{nom:"Soupe de carotte",emp:"32.004"},
{nom:"Soupe de betterave",emp:"32.005"},
{nom:"Soupe Triple",emp:"32.006"},
{nom:"Soupe de Panais",emp:"32.007"},
{nom:"Lait",emp:"32.008"},
{nom:"Jus de raisin",emp:"32.009"},
{nom:"Soupe de patate",emp:"32.010"},
{nom:"Canne a sucre",emp:"40.001"},
{nom:"Tomates",emp:"40.002"},
{nom:"Laitue",emp:"40.003"}, 
{nom:"Fraise",emp:"40.005"}, 
{nom:"Raisin vrac",emp:"40.006"},
{nom:"Arbre a chat",emp:"46.001"},
{nom:"Vêtement",emp:"46.002"},
{nom:"Mobilier",emp:"46.003"},
{nom:"Rouleau de papier",emp:"46.004"},
{nom:"Maison à Oiseaux",emp:"46.005"},
{nom:"Planche",emp:"46.006"},
{nom:"Gateaux",emp:"45.003"},
{nom:"Pain",emp:"45.004"},
];

/* ======================
   🔥 SERVEUR (REMPLACE LOCALSTORAGE)
====================== */

let commandes = [];

/* chargement serveur */
async function loadCommandes(){
try{
let res = await fetch("/commandes");
let data = await res.json();

commandes = data || [];

if(commandes.length === 0){
commandes = gen();
await save();
}

menu();

}catch(e){
console.error(e);
commandes = gen();
await save();
menu();
}
}

/* ======================
   SAVE SERVEUR
====================== */
async function save(){
await fetch("/commandes", {
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(commandes)
});
}

/* ======================
   GENERATION COMMANDES
====================== */

function gen(){

let cmds=[];
let heavyIndex = [0,1,2,3];

for(let c=0;c<12;c++){

let isHeavyCmd = heavyIndex.includes(c);

let items = produits.map(p=>{

let zone = p.emp.split(".")[0];
let qty;

if(isHeavyCmd && ["30","32","40","45"].includes(zone)){
qty = Math.floor(Math.random()*2) + 3;
}
else if(isHeavyCmd && zone === "15"){
qty = Math.floor(Math.random()*2) + 2;
}
else{
qty = Math.floor(Math.random()*2) + 1;
}

return {...p, qty, zone};

});

let prep = ["08","09","10"][Math.floor(Math.random()*3)];
let dest = ["02","03","04","05","06","07"][Math.floor(Math.random()*6)];

let id = `${dest}-${Math.floor(Math.random()*1000)}`;

cmds.push({
id,
prep,
dest,
items,
heavy:isHeavyCmd,
status:"active"
});
}

return cmds;
}

/* ======================
   START APP
====================== */
loadCommandes();

/* ======================
   COMPTEUR
====================== */
function getPaletteProgress(c){
let total=0,done=0;
(c?.items||[]).forEach(i=>{
let qty=parseInt(i.qty)||0;
total+=qty;
if(i.done)done+=qty;
});
return{
totalPalettes:total,
donePalettes:done,
leftPalettes:total-done
};
}

/* ======================
   MENU
====================== */
function menu(){

let v=document.getElementById("view");

v.innerHTML=`
<h2>📦 Commandes SERVER</h2>

<button onclick="regenCommandes()" 
style="background:#3498db;color:white;padding:10px;border:none;border-radius:6px;margin-bottom:10px;">
🔄 Générer commandes
</button>
`;

if(!commandes.length){
v.innerHTML+="<p>Aucune commande</p>";
return;
}

commandes.forEach(c=>{

let p=getPaletteProgress(c);

let d=document.createElement("div");
d.className="cmd "+(c.heavy?"heavy":"")+(c.status==="envoyée"?"done":"");

d.innerHTML=`
<span class="badge">Quai ${c.prep}</span><br>
Commande ${c.id}
${c.heavy? "<span class='fire'>🔥 LOURDE</span>":""}
<br><br>
📦 ${p.donePalettes}/${p.totalPalettes}
<br>⏳ ${p.leftPalettes}
`;

d.onclick=()=>open(c);

v.appendChild(d);
});
}

/* ======================
   REGEN
====================== */
async function regenCommandes(){
commandes=gen().slice(0,12);
await save();
menu();
}

/* ======================
   OPEN
====================== */
let current=null;
let zones=[];
let zi=0;

function open(c){
current=c;
if(!current.start)current.start=Date.now();
zones=[...new Set(current.items.map(i=>i.zone))];
zi=0;
render();
}

/* ======================
   RENDER
====================== */
function render(){

let v=document.getElementById("view");
let z=zones[zi];
let items=(current.items||[]).filter(i=>i.zone===z);

let done=current.items.filter(i=>i.done).length;

v.innerHTML=`
<div>
<button onclick="valid(i)">✔</button>
<button onclick="err(i)">❌</button>
<button onclick="restock(i)">🚨 Réapro</button>
</div>

`;

items.forEach(i=>{
let d=document.createElement("div");
d.className="item "+(i.done?"done":"");

d.innerHTML=`
<b>${i.nom}</b><br>
${i.emp} | ${i.qty}
`;

v.appendChild(d);
});
}
/* ======================
   ENVOI CARISTE
====================== */
  async function validerCommande(){

let quai = {
  id: current.id,
  prep: current.prep,
  dest: current.dest,
  items: current.items
};

try{

await fetch("http://TON_SERVEUR:3000/quai", {
  method: "POST",
  headers: {"Content-Type":"application/json"},
  body: JSON.stringify(quai)
});

current.status = "envoyée";

await save();

alert("🚚 Envoyé au cariste");

menu();

}catch(e){
console.error(e);
alert("❌ Erreur serveur");
}

}

/* ======================
   ERREUR
====================== */
async function sendError(i){

let data = {
  prod: i.nom,
  emp: i.emp,
  zone: i.zone,
  time: Date.now()
};

try{

await fetch("http://TON_SERVEUR:3000/errors", {
  method: "POST",
  headers: {"Content-Type":"application/json"},
  body: JSON.stringify(data)
});

alert("❌ Erreur envoyée");

}catch(e){
console.error(e);
alert("Erreur serveur");
}

}

/* ======================
   REAPRO
====================== */
async function restock(i){

let demande = {
  prod: i.nom,
  emp: i.emp,
  zone: i.zone,
  qty: i.qty,
  from: "preparateur",
  time: Date.now()
};

try{

await fetch(API + "/restock", {
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify(demande)
});

alert("🚨 Demande de réappro envoyée au cariste");

}catch(e){
console.error(e);
alert("Erreur serveur réappro");
}

}


</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>WMS Cariste</title>

<style>
body{
  font-family:Arial;
  background:#1e1e2f;
  color:white;
  padding:20px;
}

h1{text-align:center;}

.tabs{
  display:flex;
  justify-content:center;
  margin-bottom:20px;
}

.tab{
  background:#444;
  padding:10px 15px;
  margin:5px;
  border-radius:6px;
  cursor:pointer;
}

.active{background:#3498db;}

.section{display:none;}
.show{display:block;}

.task{
  background:#2c2c3c;
  margin:10px 0;
  padding:12px;
  border-radius:8px;
}

.zone{
  font-weight:bold;
  color:#f39c12;
}

.badge{
  background:#e74c3c;
  padding:2px 6px;
  border-radius:6px;
  font-size:12px;
}

input{
  padding:5px;
  width:80px;
  border-radius:5px;
  border:none;
}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.valid{background:#27ae60;color:white;}
.stock{background:#3498db;color:white;}
.clear{background:#e74c3c;color:white;}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.tab{
  padding:10px;
  background:#444;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.active{background:#3498db;}

.task{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#2c2c3c;
  margin:8px 0;
  padding:10px;
  border-radius:8px;
  gap:10px;
}

.task b{
  min-width:180px;
}

.task .stock{
  display:flex;
  gap:15px;
  align-items:center;
}

input{
  width:70px;
  padding:5px;
  border-radius:5px;
  border:none;
  text-align:center;
}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.clear{
  background:#e74c3c;
  color:white;
}


</style>
</head>

<body>

<h1>🚜 WMS CARISTE</h1>

<div class="tabs">

	<div class="tab active" onclick="show('restock',event)">🚨 Réappro</div>
	<div class="tab" onclick="show('stock',event)">📦 Stock</div>
	<div class="tab" onclick="show('errors',event)">❌ Erreurs</div>
	<div class="tab" onclick="show('quai',event)">🚚 Mise à quai</div>
	
	<div id="rack" style="display:none;"></div>
	<div id="pick" style="display:none;"></div>



</div>

<!-- sections -->
<div id="restock" class="section show"></div>
<div id="stock" class="section"></div>
<div id="quai" class="section"></div>
<div id="errors" class="section"></div>

</div>



<script src="stock.js"></script>

<script>

const API = "http://192.168.1.46:3000"; // ton serveur


/* =========================
   PRODUITS (ton base)
========================= */
const produits=[
{nom:"Fromages",emp:"15.002",zone:"15"},
{nom:"Beurre",emp:"15.003",zone:"15"},
{nom:"Betterave en conserve",emp:"30.001",zone:"30"},
{nom:"Carotte en conserve",emp:"30.002",zone:"30"},
{nom:"Panais en conserve",emp:"30.003",zone:"30"},
{nom:"Céréale",emp:"30.006",zone:"30"},
{nom:"Sel de Table",emp:"30.007",zone:"30"},
{nom:"Moulin a poivre",emp:"30.008",zone:"30"},
{nom:"Chips",emp:"30.009",zone:"30"},
{nom:"Sucre",emp:"30.010",zone:"30"},
{nom:"Farine",emp:"30.011",zone:"30"},
{nom:"Oeuf",emp:"30.012",zone:"30"},
{nom:"Miel",emp:"31.001",zone:"31"},
{nom:"Raisin sec",emp:"31.002",zone:"31"},
{nom:"Chocolat",emp:"31.003",zone:"31"},
{nom:"Huile de tournesol",emp:"32.001",zone:"32"},
{nom:"Huile d'olive",emp:"32.002",zone:"32"},
{nom:"Huile de colza",emp:"32.003",zone:"32"},
{nom:"Soupe de carotte",emp:"32.004",zone:"32"},
{nom:"Soupe de betterave",emp:"32.005",zone:"32"},
{nom:"Soupe Triple",emp:"32.006",zone:"32"},
{nom:"Soupe de Panais",emp:"32.007",zone:"32"},
{nom:"Lait",emp:"32.008",zone:"32"},
{nom:"Jus de raisin",emp:"32.009",zone:"32"},
{nom:"Soupe de patate",emp:"32.010",zone:"32"},
{nom:"Canne a sucre",emp:"40.001",zone:"40"},
{nom:"Tomates",emp:"40.002",zone:"40"},
{nom:"Laitue",emp:"40.003",zone:"40"}, 
{nom:"Fraise",emp:"40.005",zone:"40"}, 
{nom:"Raisin vrac",emp:"40.006",zone:"40"},
{nom:"Arbre a chat",emp:"46.001",zone:"46"},
{nom:"Vêtement",emp:"46.002",zone:"46"},
{nom:"Mobilier",emp:"46.003",zone:"46"},
{nom:"Rouleau de papier",emp:"46.004",zone:"46"},
{nom:"Maison à Oiseaux",emp:"46.005",zone:"46"},
{nom:"Planche",emp:"46.006",zone:"46"},
{nom:"Gateaux",emp:"45.003",zone:"45"},
{nom:"Pain",emp:"45.004",zone:"45"}, 
];

/* TAB */
function show(id,e){

document.querySelectorAll(".section").forEach(s=>s.classList.remove("show"));

let el = document.getElementById(id);
if(el) el.classList.add("show");

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
if(e) e.target.classList.add("active");

/* reload safe */
if(id === "stock") loadStockView?.();
if(id === "quai") loadQuai?.();
if(id === "restock") loadRestock?.();
if(id === "errors") loadErrors?.();

}



async function valider(i){

let r = await (await fetch(API+"/restock")).json();

let item = r[i];
if(!item){
alert("Réappro introuvable");
return;
}

let q = parseInt(document.getElementById("q"+i)?.value || item.qty);

if(isNaN(q) || q <= 0){
alert("Quantité invalide");
return;
}

/* STOCK SERVER */
let stock = await (await fetch(API+"/stock")).json();

let emp = String(item.emp).split(" ")[0].trim();

if(!stock[emp]){
stock[emp] = {rack:0, pick:0};
}

/* mouvement stock */
stock[emp].pick = (stock[emp].pick || 0) + q;
stock[emp].rack = Math.max(0, (stock[emp].rack || 0) - q);

/* SAVE STOCK */
await fetch(API+"/stock", {
method:"POST",
headers:{"Content-Type":"application/json"},
body: JSON.stringify(stock)
});

/* REMOVE RESTOCK */
r.splice(i,1);

await fetch(API+"/restock", {
method:"POST",
headers:{"Content-Type":"application/json"},
body: JSON.stringify(r)
});

loadRestock();

alert("✔ Réappro validé");

}

/*------------------------------------------------------------------------------*/

/* =========================
   STOCK
========================= */
function getColor(val){

if(val <= 0) return "🔴";
if(val <= 4) return "🟠";
if(val >= 5) return "🟢";
} 

function loadStock(){

let stock = JSON.parse(localStorage.getItem("stock")||"{}");

let rackDiv = document.getElementById("rack");
let pickDiv = document.getElementById("pick");

rackDiv.innerHTML="";
pickDiv.innerHTML="";

produits.forEach(p=>{

// 🔥 SAFE STOCK (IMPORTANT)
let s = stock[p.emp] || {rack:0,pick:0};

let rack = s.rack ?? 0;
let pick = s.pick ?? 0;

// ===== RACK =====
rackDiv.innerHTML += `
<div class="task">
  <b>${getColor(rack)} ${p.nom}</b> (${p.emp})
  
  🏭 Rack :
  <input type="number" value="${rack}"
  onchange="update('${p.emp}','rack',this.value)">
  
  <button onclick="validate('${p.emp}')">✔</button>
</div>
`;

// ===== PICK =====
pickDiv.innerHTML += `
<div class="task">
  <b>${getColor(pick)} ${p.nom}</b> (${p.emp})
  
  📦 Pick :
  <input type="number" value="${pick}"
  onchange="update('${p.emp}','pick',this.value)">
  
  <button onclick="validate('${p.emp}')">✔</button>
</div>
`;

});

}

/*-------*/

function loadStockView(){

let stock = JSON.parse(localStorage.getItem("stock")||"{}");

let div = document.getElementById("stock");

div.innerHTML = `
<h2>📦 Stock global</h2>

<button onclick="toggleDetail('rack')">🏭 Rack</button>
<button onclick="toggleDetail('pick')">📍 Emplacement</button>

<div id="detail"></div>
`;

renderStock("rack");

}

/*-------*/

function toggleDetail(type){
renderStock(type);
}

/*-------*/

function renderStock(type){

let stock = JSON.parse(localStorage.getItem("stock")||"{}");

let div = document.getElementById("detail");
div.innerHTML="";

produits.forEach(p=>{

let s = stock[p.emp] || {rack:0,pick:0};

let value = type === "rack" ? s.rack : s.pick;

div.innerHTML += `
<div class="task">

  <b>${p.nom}</b> (${p.emp})

  <div class="stock">

    <span>${type === "rack" ? "🏭" : "📦"}</span>

    <input type="number"
      value="${value}"
      onchange="update('${p.emp}','${type}',this.value)">

    <button onclick="validate('${p.emp}')">✔</button>

  </div>

</div>
`;

});

}



/*-------*/
function showTab(id){

document.querySelectorAll(".section").forEach(s=>s.classList.remove("show"));
document.getElementById(id).classList.add("show");

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
event.target.classList.add("active");

}

/*-------*/
function validate(emp){

let stock = JSON.parse(localStorage.getItem("stock")||"{}");

let rack = document.querySelector(`#detail input[onchange*="${emp}"]`);

if(!stock[emp]) stock[emp] = {rack:0,pick:0};

/* mise à jour directe */
stock[emp].rack = parseInt(stock[emp].rack || 0);
stock[emp].pick = parseInt(stock[emp].pick || 0);

localStorage.setItem("stock",JSON.stringify(stock));

loadStockView();
}

/*-------*/

function show(id,e){

document.querySelectorAll(".section").forEach(s=>s.classList.remove("show"));
document.getElementById(id).classList.add("show");

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
e.target.classList.add("active");

/* 👉 si stock ouvert */
if(id === "stock"){
loadStockView();
}

}

/*------------------------------------------------------------------------------*/

/* =========================
   ERREURS PREPA (LOAD SERVER)
========================= */

async function loadErrors(){

let e = await (await fetch(API+"/errors")).json();

let div = document.getElementById("errors");
div.innerHTML = "";

if(!e || e.length === 0){
div.innerHTML = "✔ Aucune erreur";
return;
}

e.forEach(x=>{

let d = document.createElement("div");
d.className = "task";

d.innerHTML = `
❌ <b>${x.prod}</b><br>
📦 ${x.emp}<br>
📍 Zone ${x.zone || "?"}<br>
⚠ ${x.type || "non défini"}<br>
`;

div.appendChild(d);

});

}

/* =========================
   ENVOYER ERREUR (SERVER)
========================= */

async function sendError(i){

let type = prompt("Type d'erreur ?");

if(!type) type = "non défini";

/* récupération serveur */
let e = await (await fetch(API+"/errors")).json();

/* ajout erreur */
e.push({
prod: i.nom,
emp: i.emp,
zone: i.zone,
type: type,
time: Date.now()
});

/* sauvegarde serveur */
await fetch(API+"/errors", {
method: "POST",
headers: {"Content-Type":"application/json"},
body: JSON.stringify(e)
});

alert("❌ Erreur envoyée");

}

/* =========================
   AUTO REFRESH
========================= */

setInterval(()=>{
loadErrors();
}, 5000);

/* =========================
   INIT
========================= */

loadErrors();


/*------------------------------------------------------------------------------*/

/* =========================
   REFRESH
========================= */

function refresh(){

try{ loadRestock(); }catch(e){ console.log(e); }
try{ loadStock(); }catch(e){ console.log(e); }
try{ loadErrors(); }catch(e){ console.log(e); }
try{ loadQuai(); }catch(e){ console.log(e); }



}

refresh();
setInterval(refresh,2000);

/*------------------------------------------------------------------------------*/

/* =========================
   MAJ STOCK (AJOUT / RETRAIT)
========================= */

async function mod(emp,type,val){

let stock = await (await fetch(API+"/stock")).json();

if(!stock[emp]){
stock[emp] = {rack:0,pick:0};
}

stock[emp][type] = (stock[emp][type] || 0) + val;

/* sécurité */
if(stock[emp][type] < 0){
stock[emp][type] = 0;
}

/* SAVE SERVEUR */
await fetch(API+"/stock", {
method:"POST",
headers:{"Content-Type":"application/json"},
body: JSON.stringify(stock)
});

loadStock();

}

/*------------------------------------------------------------------------------*/

/* =========================
   MISE À QUAI (LOAD SERVER)
========================= */

async function loadQuai(){

let data = await (await fetch(API+"/quai")).json();

let div = document.getElementById("quai");
div.innerHTML = "";

if(!data || data.length === 0){
div.innerHTML = "✔ Aucune mission mise à quai";
return;
}

data.forEach((q,i)=>{

let prep = q.prep ?? q.quaiPrep ?? "non défini";
let dest = q.dest ?? q.quaiLivraison ?? "non défini";

let d = document.createElement("div");
d.className = "task";

d.innerHTML = `
<div>
<b>Commande ${q.id ?? "?"}</b><br>
🏭 Prep : ${prep}<br>
🚚 Dest : ${dest}
</div>

<div>
<button class="valid" onclick="validerQuai(${i})">✔ Valider quai</button>
<button class="clear" onclick="supprimerQuai(${i})">❌ Annuler</button>
</div>
`;

div.appendChild(d);

});

}

/*------------------------------------------------------------------------------*/

</script>

</body>
</html>

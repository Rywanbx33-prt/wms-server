/* TAB */
function show(id,e){

document.querySelectorAll(".section").forEach(s=>s.classList.remove("show"));

let el = document.getElementById(id);
if(el) el.classList.add("show");

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
if(e) e.target.classList.add("active");

/* reload safe */

if(id === "quai") loadQuai?.();

/* =========================
   REAPPRO
========================= */
async function loadRestock(){

let res = await fetch("/restock");
let r = await res.json();

let div=document.getElementById("restock");
div.innerHTML="";

if(!document.getElementById("restock")?.classList.contains("show")){
  return;
}

if(r.length===0){
div.innerHTML="✔ Aucun réappro";
return;
}

r.forEach((x,i)=>{

d.className="task";

d.innerHTML=`

<b>${x.prod}</b><br>

🔢 demandé : ${x.qty}<br><br>

<input type="number" id="q${i}" value="${x.qty}">

`;

}


/* =========================
   STOCK
========================= */
async function loadStock(){

  let res = await fetch("/stock");
  let stock = await res.json();

  let rackDiv = document.getElementById("rack");
  let pickDiv = document.getElementById("pick");

  if(!rackDiv || !pickDiv){
    console.error("rack/pick introuvable");
    return;
  }

  rackDiv.innerHTML = "";
  pickDiv.innerHTML = "";

  produits.forEach(p => {

    let s = stock[p.emp] || {rack:0, pick:0};

    // ===== RACK =====
    rackDiv.innerHTML += `
      <div class="task">
        <b>${getColor(s.rack)} ${p.nom}</b> (${p.emp})

        🏭 Rack :
        <input type="number"
          value="${s.rack}"
          onchange="updateStock('${p.emp}','rack',this.value)">

        <button onclick="saveStock('${p.emp}')">✔</button>
      </div>
    `;

    // ===== PICK =====
    pickDiv.innerHTML += `
      <div class="task">
        <b>${getColor(s.pick)} ${p.nom}</b> (${p.emp})

        📦 Pick :
        <input type="number"
          value="${s.pick}"
          onchange="updateStock('${p.emp}','pick',this.value)">

        <button onclick="saveStock('${p.emp}')">✔</button>
      </div>
    `;
  });
}

/* =========================
   STOCK PAR ZONE
========================= */
async function loadStockView(){

  let res = await fetch("/stock");
  let stock = await res.json();

  let div = document.getElementById("stock");

  if(!div){
    console.error("❌ div #stock introuvable");
    return;
  }

  div.innerHTML = `<h2>📦 Stock par zone</h2>`;

  let zones = {};

  produits.forEach(p => {

    let zone = p.zone || p.emp.split(".")[0];

    if(!zones[zone]) zones[zone] = [];

    let s = stock[p.emp] || {rack:0, pick:0};

    zones[zone].push(`
      <div class="task">
        <b>${p.nom}</b> (${p.emp})<br>
        🏭 Rack: ${s.rack} | 📦 Pick: ${s.pick}
      </div>
    `);

  });

  for(let z in zones){
    div.innerHTML += `
      <div class="zoneBlock">
        <h3>📍 Zone ${z}</h3>
        ${zones[z].join("")}
      </div>
    `;
  }
}

/* =========================
   UPDATE STOCK
========================= */
async function update(emp,type,value){

  await fetch("/stock/update", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      emp,
      type,
      value: parseInt(value) || 0
    })
  });

}

/* =========================
   VALIDATION STOCK
========================= */
async function validate(emp){

  await fetch("/stock/validate", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({emp})
  });

  loadStockView();
}

/* =========================
   TAB SYSTEM PROPRE
========================= */
async function show(id, e){

  document.querySelectorAll(".section")
    .forEach(s => s.classList.remove("show"));

  let el = document.getElementById(id);
  if(el) el.classList.add("show");

  document.querySelectorAll(".tab")
    .forEach(t => t.classList.remove("active"));

  if(e) e.target.classList.add("active");

  try{

    if(id === "stock") await loadStockView();
    if(id === "quai") await loadQuai();
    if(id === "restock") await loadRestock();
    if(id === "errors") await loadErrors();

  }catch(err){
    console.error("TAB ERROR:", err);
  }
}


/* =========================
   GROUP BY ZONE (utile plus tard)
========================= */
function groupByZone(produits){

  let zones = {};

  produits.forEach(p => {

    let z = p.zone || (p.emp ? p.emp.split(".")[0] : "UNKNOWN");

    if(!zones[z]) zones[z] = [];

    zones[z].push(p);

  });

  return zones;
}

/* =========================
   MODE SWITCH
========================= */
function setStockMode(mode){
  stockMode = mode;
  loadStockView();
}

/* =========================
   STOCK VIEW CARISTE
========================= */
async function loadStockView(){

  let res = await fetch("/stock");
  let stock = await res.json();

  let div = document.getElementById("stock");

  if(!div){
    console.error("stockView introuvable");
    return;
  }

  div.innerHTML = `
    <h2>📦 Stock (${stockMode === "rack" ? "Rack" : "Emplacement"})</h2>

    <button onclick="setStockMode('rack')">🏭 Rack</button>
    <button onclick="setStockMode('pick')">📍 Emplacement</button>

    <br><br>
  `;

  produits.forEach(p => {

    let s = stock[p.emp] || {rack:0, pick:0};

    let value = stockMode === "rack" ? s.rack : s.pick;

    div.innerHTML += `
      <div class="task">
        <b>${p.nom}</b> (${p.emp})

        <br><br>

        <span>${stockMode === "rack" ? "🏭 Rack" : "📍 Pick"}</span>

        <input type="number"
          value="${value}"
          onchange="updateStock('${p.emp}', this.value)">

        <button onclick="saveStock()">✔</button>
      </div>
    `;
  });
}

/* UPDATE STOCK */
async function updateStock(emp, type, value){

  value = parseInt(value) || 0;

  await fetch("/stock", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      emp,
      type,
      value
    })
  });

  // refresh local
  loadStockServer();
}

/* SAVE STOCK (juste refresh serveur) */
function saveStock(emp){
  loadStockServer();
}

/* EXPORT STOCK (download JSON) */
async function saveStockToFile(){

  let res = await fetch("/stock");
  let stock = await res.json();

  let blob = new Blob([JSON.stringify(stock,null,2)], {
    type: "application/json"
  });

  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "stock.json";
  a.click();
}

/* LOAD FILE IMPORT */
function loadStockFile(e){

  let file = e.target.files[0];
  if(!file) return;

  let reader = new FileReader();

  reader.onload = async function(evt){

    let data = JSON.parse(evt.target.result);

    await fetch("/stock/import", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(data)
    });

    alert("✔ Stock importé !");
    loadStockServer();
  };

  reader.readAsText(file);
}

try{ loadQuai(); }catch(e){ console.log(e); }

setInterval(() => {
  if(document.getElementById("restock")?.classList.contains("show")){
    loadRestock();
  }
  if(document.getElementById("stock")?.classList.contains("show")){
    loadStockView();
  }
  if(document.getElementById("quai")?.classList.contains("show")){

/* =========================
   Mise a quai
========================= */
async function loadQuai(){

  let res = await fetch("/quai");
  let data = await res.json();

  let div = document.getElementById("quai");
  div.innerHTML = "";

  if(data.length === 0){
    div.innerHTML = "✔ Aucune mission";
    return;
  }

  data.forEach((q,i)=>{

    let d = document.createElement("div");
    d.className = "task";

    d.innerHTML = `
      <b>Commande ${q.id}</b><br>
      🏭 ${q.prep} → 🚚 ${q.dest}
      <br><br>
      <button onclick="validerQuai(${i})">✔</button>
      <button onclick="supprimerQuai(${i})">❌</button>
    `;

    div.appendChild(d);
  });
}



div.appendChild(d);

});

}
/*SUPRIMER MISE A QUAI*/
function supprimerQuai(i){

let res = await fetch("/quai");
let data = await res.json();

	let q = data[i];
if(!q) return;

/* suppression */
data.splice(i,1);

await fetch("/quai", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(data)
});
	
loadQuai();

alert("❌ Mise à quai annulée");
}

/*VALIDER MISE A QUAI*/
function validerQuai(i){

let [res1, res2] = await Promise.all([
  fetch("/quai"),
  fetch("/quai_done")
]);

let data = await res1.json();
let done = await res2.json();

let q = data[i];
if(!q){
alert("Mission introuvable");
return;
}

let val = document.getElementById("q"+i)?.value;

if(!val || val <= 0){
alert("Quantité invalide");
return;
}

/* suppression mission */
data.splice(i,1);

await fetch("/quai", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(data)
});

await fetch("/quai_done", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(done)
});

loadQuai();

alert("✔ Mise à quai validée");
}
